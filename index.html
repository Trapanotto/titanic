<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a1422">
  <title>RMS Titanic – Rundgang in 3D</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/app/style.css">
</head>
<body>
  <canvas id="view" tabindex="-1"></canvas>
  <div id="ui"></div>

  <div id="start" hidden>
    <div class="liner">White Star Line</div>
    <h2 id="start-title">RMS Titanic</h2>
    <button id="start-btn" type="button">Rundgang starten</button>
    <button id="sink-btn" type="button">Nacht des 14. April</button>
    <div class="start-keys">
      <span><b>W A S D</b> bewegen</span>
      <span><b>Maus</b> umsehen</span>
      <span><b>M</b> Karte anzeigen</span>
    </div>
  </div>

  <div id="loading">
    <div class="emblem">★</div>
    <div class="liner">White Star Line</div>
    <h1>RMS Titanic</h1>
    <div class="subtitle">Southampton – New York, April 1912</div>
    <div class="rule"></div>
    <div class="bar"><div id="loading-bar"></div></div>
    <div id="loading-label">Das Schiff wird vorbereitet …</div>
    <div id="loading-warn"></div>
  </div>

  <noscript><p style="position:fixed;inset:auto 0 20px;text-align:center;z-index:99">Für den Rundgang wird JavaScript benötigt.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
